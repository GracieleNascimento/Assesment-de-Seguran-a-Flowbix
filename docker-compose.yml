# Postgres de desenvolvimento da API.  docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: flowbix-postgres
    environment:
      POSTGRES_USER: flowbix
      POSTGRES_PASSWORD: flowbix_dev
      POSTGRES_DB: flowbix_assessment
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowbix -d flowbix_assessment"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
